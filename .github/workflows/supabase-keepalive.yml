name: Supabase Inactivity Keep-Alive

on:
  schedule:
    # Runs daily at 04:00 UTC (~every 24 hours) to keep Supabase Free tier active
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions console

concurrency:
  group: supabase-keepalive
  cancel-in-progress: true

jobs:
  keep-alive:
    name: Supabase Compute Probe
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run Supabase Keep-Alive Health Probe
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/supabase-keepalive.js
